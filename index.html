<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="La Cafétéria — le hub de mini-applications et jeux entre potes." />
    <title>La Cafétéria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      (function () {
        // Le fond choisi (voir src/hooks/useTheme.ts), appliqué avant le
        // premier rendu pour éviter un éclair du mauvais fond.
        var b = 'earth';
        try {
          var v = localStorage.getItem('userTheme');
          var legacy = localStorage.getItem('cafeteria-theme');
          if (v === 'gold' || v === 'dark' || v === 'earth') b = v;
          else if (legacy === 'light') b = 'gold';
          else if (legacy === 'dark') b = 'dark';
        } catch (e) {}
        document.documentElement.setAttribute('data-backdrop', b);
        document.documentElement.setAttribute('data-theme', b === 'gold' ? 'light' : 'dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
